<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="取件直达">
  <title>取件直达</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8f4;
      color: #1b1d1b;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: #f7f8f4;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom));
    }

    .brand {
      margin: 0;
      color: #5b605b;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 8px 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }

    .lead {
      margin: 0 0 26px;
      color: #5b605b;
      font-size: 15px;
      line-height: 1.6;
    }

    .entries {
      display: grid;
      gap: 12px;
    }

    .entry {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 28px;
      align-items: center;
      min-height: 84px;
      padding: 14px 14px 14px 16px;
      border: 0;
      border-radius: 8px;
      color: inherit;
      text-align: left;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .entry:active {
      transform: scale(.985);
    }

    .entry.cainiao {
      background: #e7f4eb;
      --accent: #147848;
    }

    .entry.taobao {
      background: #fff0e3;
      --accent: #c24b12;
    }

    .entry.pinduoduo {
      background: #ffe8ec;
      --accent: #be233c;
    }

    .mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 7px;
      background: var(--accent);
      color: white;
      font-size: 18px;
      font-weight: 800;
    }

    .label {
      min-width: 0;
      padding: 0 14px;
    }

    .label strong,
    .label span {
      display: block;
      overflow-wrap: anywhere;
    }

    .label strong {
      font-size: 17px;
    }

    .label span {
      margin-top: 4px;
      color: #5b605b;
      font-size: 13px;
    }

    .arrow {
      color: var(--accent);
      font-size: 28px;
      line-height: 1;
      text-align: center;
    }

    .fallbacks {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 22px;
    }

    .fallbacks a {
      min-width: 0;
      padding: 13px 6px;
      border: 1px solid #dfe2dc;
      border-radius: 8px;
      background: #fff;
      color: #343834;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 24px;
      color: #777d77;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">取件直达</p>
    <h1>不用再翻三个 App</h1>
    <p class="lead">点击对应入口，直接前往取件身份码。</p>

    <section class="entries" aria-label="取件入口">
      <a class="entry cainiao" href="cainiao://desktop/station_code">
        <span class="mark" aria-hidden="true">菜</span>
        <span class="label">
          <strong>菜鸟驿站取件</strong>
          <span>打开菜鸟身份码</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="entry taobao" href="taobao://m.taobao.com/tbopen/index.html?h5Url=https%3A%2F%2Fpages-fast.m.taobao.com%2Fwow%2Fz%2Funiapp%2F1100333%2Flast-mile-fe%2Fm-end-school-tab%2Fhome">
        <span class="mark" aria-hidden="true">淘</span>
        <span class="label">
          <strong>淘宝取件</strong>
          <span>打开淘宝身份码</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="entry pinduoduo" href="pinduoduo://com.xunmeng.pinduoduo/mdkd/package?tab=ID_CODE&amp;entry_source=11">
        <span class="mark" aria-hidden="true">拼</span>
        <span class="label">
          <strong>拼多多取件</strong>
          <span>打开拼多多身份码</span>
        </span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>

    <nav class="fallbacks" aria-label="网页备用入口">
      <a href="https://market.m.taobao.com/app/cn-yz/multi-activity/authCode.html?bizEntry=ALIPAY_GUOGUO">菜鸟网页 ↗</a>
      <a href="https://pages-fast.m.taobao.com/wow/z/uniapp/1100333/last-mile-fe/m-end-school-tab/home">淘宝网页 ↗</a>
      <a href="https://m.pinduoduo.net/mdkd/package?entry_source=18&amp;extra_params=from_wx_jump%3D1&amp;p_channel=0">拼多多网页 ↗</a>
    </nav>

    <footer>第三方应用更新后，内部页面地址可能发生变化。</footer>
  </main>

  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
